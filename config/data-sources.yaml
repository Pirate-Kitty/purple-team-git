# External data sources for the purple-team workflow.
# Neither path below is stored inside this repo's git history — both point
# outside it. Fill these in once confirmed; do not commit real internal
# hostnames here if this repo is ever shared beyond its intended audience.
#
# To keep real values out of git entirely, put them in
# config/data-sources.local.yaml instead (gitignored, never committed).
# Commands and the atomic-red-team-mapper agent check that file first, per
# key, and fall back to the values below for any key it doesn't set.

# Local clone of https://github.com/redcanaryco/atomic-red-team
# Read-only source for the atomic-red-team-mapper agent.
atomic_red_team_path: null  # e.g. /path/to/atomic-red-team

# External root for raw exercise evidence (logs, screenshots, pcaps).
# Never stored inside this repo. Exercise metadata.yaml files reference
# subpaths under this root.
evidence_root: null  # e.g. /path/to/purple-team-evidence

# Local clone of the sibling complex-analysis threat-intel/correlation CLI
# project. Path-only reference — no code from that project is vendored or
# copied here. Not currently read by any purple-team command; documented
# for manual cross-tool workflows (see HANDOFF.md).
complex_analysis_path: null  # e.g. /path/to/complex-analysis
